[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iterative-research-harness"
version = "0.2.3"
description = "A small, persistent harness for iterative research agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "jsonschema>=4.19,<5",
  "mcp>=1.12,<3",
  "openai>=1.70,<3",
  "pydantic>=2.10,<3",
  "starlette>=0.46,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
irh = "irh.cli:main"
irh-daemon = "irh.daemon:main"
irh-runpod-mcp = "irh.runpod_mcp:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/irh"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
